[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag_with_oag"
version = "0.2.0.dev0"
description = "RAG, ontology-augmented generation (OAG) and hybrid retrieval over a single FalkorDB graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sami Özsoy" }]
keywords = ["rag", "graphrag", "ontology", "falkordb", "llm", "knowledge-graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "falkordb>=1.8,<2",
    "falkordblite>=0.10,<0.11",
    "openai>=3,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "adaptive-oci-chunking>=0.3,<0.4",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2", "adaptive-oci-chunking[pdf]>=0.3,<0.4"]
local = ["fastembed>=0.4"]
all = ["rag_with_oag[pdf,local]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "types-PyYAML",
    "numpy>=1.26",
]

[project.scripts]
rag-with-oag = "rag_with_oag.cli:main"

[project.urls]
Homepage = "https://github.com/Sami-Ozsoy/rag_with_oag"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_with_oag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the embedded FalkorDB server"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Turkish text in docs and fixtures
    "SIM905",  # word lists read better as split strings
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag_with_oag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["falkordb.*", "redislite.*", "adaptive_chunking.*", "fastembed.*", "pypdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rag_with_oag.cli"]
disallow_any_explicit = false
